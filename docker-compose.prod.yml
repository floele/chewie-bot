# docker-compose.yml
version: "3"
volumes:
    chewiebot-db:
    images:
    certbot-var:
    certbot-etc:
    web-root:

services:
    ui:
        image: magentafall/chewiebot:client-latest
        container_name: client
        ports:
            - 80:80
            - 443:443
        expose:
            - 80
        volumes:
            - web-root:/var/www/html
            - certbot-etc:/etc/letsencrypt
            - certbot-var:/var/lib/letsencrypt
            - ./dhparam:/etc/ssl/certs
        command: ["nginx", "-g", "daemon off;"]
    certbot:
        image: certbot/certbot
        container_name: certbot
        volumes: 
            - certbot-etc:/etc/letsencrypt
            - certbot-var:/var/lib/letsencrypt
            - web-root:/var/www/html
            - /var/run/docker.sock:/var/run/docker.sock
            - ./scripts/reload-nginx.sh:/reload-nginx.sh
        depends_on:
            - ui
        networks:
            - front
        command: certonly --webroot --webroot-path=/var/www/html --email magenta.fall@protonmail.com --agree-tos --no-eff-email --force-renewal -d chewiemelodies.com -d www.chewiemelodies.com

    certbot-renew:
        image: certbot/certbot
        container_name: certbot-renew
        volumes: 
            - certbot-etc:/etc/letsencrypt
            - certbot-var:/var/lib/letsencrypt
            - web-root:/var/www/html
            - /var/run/docker.sock:/var/run/docker.sock
            - ./scripts/reload-nginx.sh:/reload-nginx.sh
        entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/html --post-hook '/reload-nginx.sh'; sleep 24h & wait $${!}; done"
        depends_on:
            - ui
        networks:
            - front

    backend:
        image: magentafall/chewiebot:server-latest
        container_name: server
        volumes:
            - chewiebot-db:/usr/src/chewiebot/server/dist/db
            - images:/usr/src/chewiebot/server/dist/images
            - certbot-etc:/etc/letsencrypt
        environment:
            NODE_ENV: production
        command: ["pm2-runtime", "start.js"]
